<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAsQ3</title>
</head>
<body>
    <form action="action/">
        <h2>Feedback Form</h2>
        <div>
            Name:
            <input type="text" placeholder="Write your name" name="name" id="name">
        </div>
        <br>
        <div>
            Email:
            <input type="text" placeholder="Write your email" name="email" id="email">
        </div>
        <br>
        Message:<br>
        <textarea rows="20" cols="" id="msg" ></textarea>
        <br>
        Rate us our of 5:<br>
        <div>
        <input type="radio" value="rating" name="rating">
         1
         <br>
        </div>
        <div>
        <input type="radio" value="rating" name="rating">
         2
         <br>
        </div>
        <div>
        <input type="radio" value="rating" name="rating">
         3
         <br>
        </div>
        <div>
        <input type="radio" value="rating" name="rating">
         4
         <br>
        </div>
        <div>
        <input type="radio" value="rating" name="rating">
         5
         <br>
        </div>
        <br>
        <br>
        <button type="submit">Send you message</button>
    </form>
</body>
</html>
